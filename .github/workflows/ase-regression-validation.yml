name: ASE regression validation

on:
  workflow_dispatch:
  push:
    branches: [ci/ase-refresh-regression-20261107]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools==68.2.2 wheel Cython==3.0.12 numpy==1.26.4 packaging==25.0 setuptools-scm==8.3.1
          python -m pip install --no-build-isolation -e . paddlepaddle==3.1.0 pytest==8.3.5
      - name: Test ASE calculator
        run: |
          python -c "import ppmat; print('Imported', ppmat.__file__)"
          python -m pytest -q test/test_ase_calculator.py
